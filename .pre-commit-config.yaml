repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check
        language: system
        types: [python]
      - id: ruff-format-check
        name: ruff format check
        entry: ruff format --check
        language: system
        types: [python]
      - id: model-contract
        name: verify locked Gemma 4 contract
        entry: python scripts/verify_model_contract.py
        language: system
        pass_filenames: false
